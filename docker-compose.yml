services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-local
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  
  postgrest-clients:
    image: postgres:15
    container_name: db-clients
    restart: always
    environment:
      POSTGRES_DB: clientsdb
      POSTGRES_USER: client_user
      POSTGRES_PASSWORD: client_secret
    ports:
      - "5433:5432"
    volumes:
      - clients_data:/var/lib/postgresql/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: storage-images
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  postgrest-claims:
    image: postgres:15
    container_name: db-claims
    environment:
      POSTGRES_DB: claimsdb
      POSTGRES_USER: claims_user
      POSTGRES_PASSWORD: claims_secret
    ports:
      - "5434:5432"
    volumes:
      - claims_data:/var/lib/postgresql/data
  
  chromadb:
    image: chromadb/chroma:latest
    container_name: vectorial-db
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-local
    ports:
      - "6379:6379"
  
  langfuse-db:
    image: postgres:16
    container_name: langfuse-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse-server:
    image: langfuse/langfuse:2
    container_name: langfuse-server
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3100
      - NEXTAUTH_SECRET=un_secreto_muy_largo_y_seguro_cambiame_123456
      - SALT=otro_secreto_aleatorio_para_encriptacion_123456
      - DATABASE_URL=postgresql://postgres:mysecretpassword@langfuse-db:5432/langfuse
      - TELEMETRY_ENABLED=true


volumes:
  clients_data:
  minio_data:
  claims_data:
  chroma_data:
  langfuse_db_data:
